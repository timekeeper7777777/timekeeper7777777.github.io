# Fluid 主题配置（CYBER 赛博朋克版）
# 完整可选项见 node_modules/hexo-theme-fluid/_config.yml

# 导航栏
menu:
  - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
  - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
  - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
  - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
  - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

# 默认深色（赛博朋克的主场）
dark_mode:
  enable: true
  default: dark

# 配色：深浅两套都走霓虹深色系，怎么切都是赛博
color:
  body_bg_color: "#05070d"
  body_bg_color_dark: "#05070d"

  navbar_bg_color: "#050910"
  navbar_bg_color_dark: "#050910"
  navbar_text_color: "#c9d8e8"
  navbar_text_color_dark: "#c9d8e8"

  subtitle_color: "#9fe9ff"
  subtitle_color_dark: "#9fe9ff"

  text_color: "#c9d8e8"
  text_color_dark: "#c9d8e8"

  sec_text_color: "#7f9bb5"
  sec_text_color_dark: "#7f9bb5"

  board_color: "#0b111c"
  board_color_dark: "#0b111c"

  post_text_color: "#c9d8e8"
  post_text_color_dark: "#c9d8e8"

  post_heading_color: "#e8f6ff"
  post_heading_color_dark: "#e8f6ff"

  post_link_color: "#00f0ff"
  post_link_color_dark: "#00f0ff"

  link_hover_color: "#ff2e97"
  link_hover_color_dark: "#ff2e97"

  link_hover_bg_color: "#0d1723"
  link_hover_bg_color_dark: "#0d1723"

  line_color: "#16283a"
  line_color_dark: "#16283a"

  scrollbar_color: "#16324a"
  scrollbar_color_dark: "#16324a"
  scrollbar_hover_color: "#00f0ff"
  scrollbar_hover_color_dark: "#00f0ff"

  button_bg_color: "transparent"
  button_bg_color_dark: "transparent"
  button_hover_bg_color: "#0f1c28"
  button_hover_bg_color_dark: "#0f1c28"

# 字体
font:
  font_size: 16px
  font_family:
  letter_spacing: 0.01em
  code_font_size: 90%

# 自定义样式与脚本（路径相对 source 目录）
custom_css:
  - /css/custom.css
custom_js:
  - /js/custom.js

# 首屏
banner:
  random_img: false
  parallax: true
  width_height_ratio: 1.0

# 首页
index:
  banner_img: /img/default.png
  banner_img_height: 100
  banner_mask_alpha: 0.1
  slogan:
    enable: true
    text: "记录取证、代码与一切被拆解的东西"
  auto_excerpt:
    enable: true
  post_url_target: _self
  post_meta:
    date: true
    category: true
    tag: true

# 文章页
post:
  banner_img: /img/default.png
  banner_img_height: 40
  banner_mask_alpha: 0.1

# 站内搜索，依赖 hexo-generator-search
search:
  enable: true
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

# 页脚
footer:
  content: ' © 2026 TIMEKEEPER // NODE ONLINE '
  statistics:
    enable: false
