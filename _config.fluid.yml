# Fluid 主题配置（JOJO7 / Steel Ball Run 版）
# 完整可选项见 node_modules/hexo-theme-fluid/_config.yml

# 导航栏
menu:
  - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
  - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
  - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
  - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
  - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

# 默认羊皮纸浅色（漫画页质感），可切深夜蓝
dark_mode:
  enable: true
  default: light

# 配色：羊皮纸 + 漫画墨（浅）/ 深夜蓝 + 米金（深）
color:
  body_bg_color: "#f2e8d5"
  body_bg_color_dark: "#0e1a2b"

  navbar_bg_color: "#0b1626"
  navbar_bg_color_dark: "#0b1626"
  navbar_text_color: "#f0e6cc"
  navbar_text_color_dark: "#f0e6cc"

  subtitle_color: "#e9dcbb"
  subtitle_color_dark: "#e9dcbb"

  text_color: "#241c12"
  text_color_dark: "#e8dcc0"

  sec_text_color: "#6b5b45"
  sec_text_color_dark: "#9d8f74"

  board_color: "#faf3e3"
  board_color_dark: "#16263c"

  post_text_color: "#241c12"
  post_text_color_dark: "#e8dcc0"

  post_heading_color: "#241c12"
  post_heading_color_dark: "#f0c75e"

  post_link_color: "#a03d2d"
  post_link_color_dark: "#f0c75e"

  link_hover_color: "#8a6a1f"
  link_hover_color_dark: "#e9b44c"

  link_hover_bg_color: "rgba(201,162,39,.18)"
  link_hover_bg_color_dark: "#1d2f4a"

  line_color: "#d8c9a8"
  line_color_dark: "#2b3f5c"

  scrollbar_color: "#12233b"
  scrollbar_color_dark: "#12233b"
  scrollbar_hover_color: "#8a6a1f"
  scrollbar_hover_color_dark: "#8a6a1f"

  button_bg_color: "transparent"
  button_bg_color_dark: "transparent"
  button_hover_bg_color: "rgba(201,162,39,.22)"
  button_hover_bg_color_dark: "#1d2f4a"

# 字体
font:
  font_size: 16px
  font_family:
  letter_spacing: 0.01em
  code_font_size: 90%

# 自定义样式与脚本（路径相对 source 目录）
custom_css:
  - /css/custom.css
custom_js:
  - /js/custom.js

# 首屏
banner:
  random_img: false
  parallax: true
  width_height_ratio: 1.0

# 首页
index:
  banner_img: /img/default.png
  banner_img_height: 100
  banner_mask_alpha: 0.1
  slogan:
    enable: true
    text: "在圆弧之上，记录每一次回旋"
  auto_excerpt:
    enable: true
  post_url_target: _self
  post_meta:
    date: true
    category: true
    tag: true

# 文章页
post:
  banner_img: /img/default.png
  banner_img_height: 40
  banner_mask_alpha: 0.1

# 站内搜索，依赖 hexo-generator-search
search:
  enable: true
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

# 页脚
footer:
  content: ' © 2026 TIMEKEEPER // STEEL BALL RUN '
  statistics:
    enable: false
