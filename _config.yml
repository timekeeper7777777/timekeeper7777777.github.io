# Site --------------------------------------------------
title: TIMEKEEPER 日志
subtitle: '在圆弧之上，记录每一次回旋'
description: '电子数据取证 / 编程 / 学习笔记'
keywords: 取证, 编程, 学习笔记
author: Timekeeper
language: zh-CN
timezone: Asia/Shanghai

# URL ---------------------------------------------------
# 改成你自己的地址。仓库名如果叫 <用户名>.github.io，root 就保持 /
url: https://timekeeper7777777.github.io
root: /

permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory ---------------------------------------------
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing -----------------------------------------------
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting -------------------------------------
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag ----------------------------------------
default_category: uncategorized
category_map:
tag_map:

# Date / Time format ------------------------------------
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination --------------------------------------------
per_page: 10
pagination_dir: page

# Extensions --------------------------------------------
theme: fluid

# Deployment --------------------------------------------
# 走 GitHub Actions，这里留空即可
deploy:
  type: ''
